[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacetraders"
version = "0.2.0"
description = "Cliente Python y bots para la API del juego SpaceTraders.io"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["spacetraders", "spacetraders.api", "bots"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "datamodel-code-generator>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: toca la API real (saltear con -m 'not network')",
]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# El modulo generado no sigue nuestras reglas de estilo y se reescribe entero.
"spacetraders/models.py" = ["ALL"]
